[project]
name = "recentdisaster"
version = "0.1.0"
description = "Zero-cost recent incident monitor for West Java (Jawa Barat)"
readme = "README.md"
authors = [
    { name = "hariswb", email = "hariswb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=0.4.13",
    "trafilatura>=2.2.0",
]

[project.scripts]
recentdisaster = "recentdisaster:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
